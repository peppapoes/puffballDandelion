<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Puffball Dandelion</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <!-- Startscherm: browsers laten pas geluid toe na een klik -->
    <div id="start-screen">
      <h1>Puffball Dandelion</h1>
      <button id="start-button" type="button">Klik om te beginnen</button>
      <p class="hint">↑ ↓ dag en nacht</p>
    </div>

    <div id="backend-badge" hidden></div>

    <!-- Windroos: sleep om de wind uit een andere hoek te laten komen (WindRose.js) -->
    <div id="wind-rose" hidden title="Sleep om de windrichting te kiezen · blaas in de microfoon voor meer wind"></div>

    <!-- Webcam (beweging + licht, op de GPU): knop, status, webcambeeld en de cirkel die je hand volgt -->
    <div id="camera-controls">
      <p id="camera-status"></p>
      <video id="camera-video" playsinline muted></video>
      <button id="camera-button" type="button" hidden>📷 Camera aan</button>
      <!-- Microfoon: blazen = wind (en ingezoomd: pluisjes wegblazen) -->
      <button id="mic-button" type="button" hidden>🎤 Microfoon aan</button>
      <!-- Blaasmeter: licht op als de microfoon je hoort blazen -->
      <div id="mic-meter" hidden><div></div></div>
    </div>
    <div id="hand-indicator"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
