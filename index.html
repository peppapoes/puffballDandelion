<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Puffball Dandelion</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Lettertype: Quicksand (rond en zacht) via Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <!-- Startscherm: browsers laten pas geluid toe na een klik; ondertussen laden het model en de shaders al.
         De zwevende pluisjes (#floating-seeds) maakt main.js aan. -->
    <div id="start-screen">
      <div id="floating-seeds" aria-hidden="true"></div>
      <div class="start-card glass">
        <!-- Logo: een pluizenbol waarvan net één pluisje wegvliegt -->
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
          <path class="logo-stem" d="M32 26 C 31 40, 34 50, 30 62" />
          <g class="logo-puff">
            <line x1="32" y1="24" x2="47.0" y2="24.0" /><circle cx="47.0" cy="24.0" r="1.6" /><line x1="32" y1="24" x2="45.9" y2="29.7" /><circle cx="45.9" cy="29.7" r="1.6" /><line x1="32" y1="24" x2="42.6" y2="34.6" /><circle cx="42.6" cy="34.6" r="1.6" /><line x1="32" y1="24" x2="37.7" y2="37.9" /><circle cx="37.7" cy="37.9" r="1.6" /><line x1="32" y1="24" x2="32.0" y2="39.0" /><circle cx="32.0" cy="39.0" r="1.6" /><line x1="32" y1="24" x2="26.3" y2="37.9" /><circle cx="26.3" cy="37.9" r="1.6" /><line x1="32" y1="24" x2="21.4" y2="34.6" /><circle cx="21.4" cy="34.6" r="1.6" /><line x1="32" y1="24" x2="18.1" y2="29.7" /><circle cx="18.1" cy="29.7" r="1.6" /><line x1="32" y1="24" x2="17.0" y2="24.0" /><circle cx="17.0" cy="24.0" r="1.6" /><line x1="32" y1="24" x2="18.1" y2="18.3" /><circle cx="18.1" cy="18.3" r="1.6" /><line x1="32" y1="24" x2="21.4" y2="13.4" /><circle cx="21.4" cy="13.4" r="1.6" /><line x1="32" y1="24" x2="26.3" y2="10.1" /><circle cx="26.3" cy="10.1" r="1.6" /><line x1="32" y1="24" x2="32.0" y2="9.0" /><circle cx="32.0" cy="9.0" r="1.6" /><line x1="32" y1="24" x2="37.7" y2="10.1" /><circle cx="37.7" cy="10.1" r="1.6" />
            <circle class="logo-center" cx="32" cy="24" r="2.6" />
          </g>
          <g class="logo-flying">
            <line x1="55" y1="14" x2="51" y2="6" /><line x1="51" y1="6" x2="47" y2="4" /><line x1="51" y1="6" x2="50" y2="1.5" /><line x1="51" y1="6" x2="54.5" y2="2.5" />
          </g>
        </svg>
        <h1>Puffball Dandelion</h1>
        <p class="tagline">A meadow full of dandelion clocks. Brush, blow and watch the seeds drift away.</p>
        <!-- Geen uitleg hier: de tips komen één voor één in de wei (Hints.js) -->
        <button id="start-button" class="pill pill-big" type="button">Step into the meadow</button>
        <p class="small">Best with sound on</p>
      </div>
    </div>

    <div id="backend-badge" hidden></div>

    <!-- Windroos: sleep om de wind uit een andere hoek te laten komen (WindRose.js) -->
    <div id="wind-rose" class="glass-soft" hidden title="Drag the dot to choose where the wind comes from · blow into the microphone for stronger wind"></div>

    <!-- Eerste tip, in het midden (Hints.js): rondkijken en zoomen. Klikken en slepen gaan er gewoon doorheen. -->
    <div id="center-hint" hidden aria-live="polite">
      <svg class="icon center-hint-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="6" /><line x1="12" x2="12" y1="7" y2="10" /></svg>
      <p>Drag to look around · scroll to zoom</p>
    </div>

    <!-- Ingezoomd op één bloem (Hints.js): hoe kom je terug? Bovenaan, zodat de bol vrij blijft. -->
    <div id="focus-hint" hidden aria-live="polite">
      <p>Click outside the puffball or press <kbd>Esc</kbd> to go back to the meadow</p>
    </div>

    <!-- Tips na het starten (Hints.js): een zacht kaartje met een knop om het meteen te proberen -->
    <div id="hint" class="glass" role="status" hidden>
      <span class="hint-icon" aria-hidden="true"></span>
      <p class="hint-text"></p>
      <button class="hint-action pill pill-small" type="button"></button>
      <button class="hint-close" type="button" aria-label="Close tip">×</button>
    </div>

    <!-- Rechtsonder: status, webcambeeld en de knoppen (camera, microfoon + blaasmeter, muziek) -->
    <div id="camera-controls">
      <p id="camera-status" class="glass-soft"></p>
      <video id="camera-video" playsinline muted></video>
      <div class="button-row">
        <!-- Webcam: handtracking + licht van de kamer (CameraVision.js) -->
        <button id="camera-button" class="pill" type="button" hidden aria-pressed="false" title="Use your webcam: move your hand through the flowers, and the light in your room sets day or night">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" /><circle cx="12" cy="13" r="3" /><line class="off-line" x1="3" y1="3" x2="21" y2="21" /></svg>
          <span class="label">Hands</span>
        </button>
        <!-- Microfoon: blazen = wind (en ingezoomd: pluisjes wegblazen) (Microphone.js) -->
        <button id="mic-button" class="pill" type="button" hidden aria-pressed="false" title="Use your microphone: blow to make the wind stronger, or to blow the seeds off a flower">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" /><path d="M19 10v2a7 7 0 0 1-14 0v-2" /><line x1="12" x2="12" y1="19" y2="22" /><line class="off-line" x1="3" y1="3" x2="21" y2="21" /></svg>
          <span class="label">Blow</span>
        </button>
        <!-- Muziek (dag ↔ nacht) aan of uit (AmbientMusic.js) -->
        <button id="music-button" class="pill" type="button" hidden aria-pressed="true" title="Music that drifts from day to night">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /><line class="off-line" x1="3" y1="3" x2="21" y2="21" /></svg>
          <span class="label">Music</span>
        </button>
      </div>
      <!-- Blaasmeter: loopt vol als de microfoon je hoort blazen -->
      <div id="mic-meter" hidden><div></div></div>
    </div>
    <div id="hand-indicator"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
